name = "orbit-notion"
main = "dist/index.js"
compatibility_date = "2025-01-01"

# Compile TypeScript before booting the dev server, and recompile on src changes.
[build]
command = "npx tsc"
cwd = "."
watch_dir = "src"

# Serve the Notion-like SPA from public/. Cloudflare's assets layer handles
# GET requests that match a file (e.g. /, /styles.css, /app.js); everything
# else (REST + WS) falls through to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "Workspace"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "Page"
class_name = "Page"

[[migrations]]
tag = "v1"
new_classes = ["Workspace", "Page"]

# SESSIONS KV stores session:<token> -> {userId, displayName}.
# In `wrangler dev` local mode (the default) the id is not validated, so this
# placeholder is fine; replace it with a real namespace id before deploying.
[[kv_namespaces]]
binding = "ORBIT_NOTION_SESSIONS"
id = "8319b6c8f62f474f8897687ce0f21eef"
