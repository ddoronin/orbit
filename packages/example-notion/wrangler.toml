name = "orbit-notion"
main = "dist/index.js"
compatibility_date = "2025-01-01"

# Compile worker TypeScript. Frontend assets are built via npm scripts.
[build]
command = "npx tsc"
cwd = "."
watch_dir = "src"

# Serve generated SPA assets from public/. Everything not matched by static
# assets (REST + WS) falls through to the Worker.
[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "Workspace"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "Page"
class_name = "Page"

[[migrations]]
tag = "v1"
new_classes = ["Workspace", "Page"]

# SESSIONS KV stores session:<token> -> {userId, displayName}.
# In `wrangler dev` local mode (the default) the id is not validated, so this
# placeholder is fine; replace it with a real namespace id before deploying.
[[kv_namespaces]]
binding = "ORBIT_NOTION_SESSIONS"
id = "8319b6c8f62f474f8897687ce0f21eef"

# D1 table for the tutorial's end-to-end login audit example.
# Replace database_id with a real id before deploy, or create a local db in dev.
[[d1_databases]]
binding = "ORBIT_NOTION_DB"
database_name = "orbit-notion-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Queue used by the tutorial's end-to-end producer/consumer example.
[[queues.producers]]
binding = "ORBIT_NOTION_AUDIT_QUEUE"
queue = "orbit-notion-audit-logins"

[[queues.consumers]]
queue = "orbit-notion-audit-logins"
